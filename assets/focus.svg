<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2430"/>
      <stop offset="100%" stop-color="#0B1C28"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1FE1C0"/><stop offset="1" stop-color="#3DB8FF"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3DB8FF"/><stop offset="1" stop-color="#7C9CFF"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C9CFF"/><stop offset="1" stop-color="#1FE1C0"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <rect x="10" y="16" width="340" height="188" rx="18" fill="url(#card)" stroke="#1FE1C044"/>
  <circle cx="56" cy="58" r="18" fill="#102833" stroke="url(#a1)" stroke-width="2"/>
  <path d="M48 58h16M56 50v16" stroke="#1FE1C0" stroke-width="2" stroke-linecap="round"/>
  <text x="86" y="64" fill="#E8F4F8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">Blockchain</text>
  <text x="34" y="108" fill="#9BB4C0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">
    <tspan x="34" dy="0">Smart contracts, multi-chain</tspan>
    <tspan x="34" dy="22">systems, and security-first</tspan>
    <tspan x="34" dy="22">decentralized architecture.</tspan>
  </text>

  <!-- Card 2 -->
  <rect x="380" y="16" width="340" height="188" rx="18" fill="url(#card)" stroke="#3DB8FF44"/>
  <circle cx="426" cy="58" r="18" fill="#102833" stroke="url(#a2)" stroke-width="2"/>
  <circle cx="426" cy="58" r="6" fill="#3DB8FF"/>
  <text x="456" y="64" fill="#E8F4F8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">AI &amp; Data</text>
  <text x="404" y="108" fill="#9BB4C0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">
    <tspan x="404" dy="0">LLM platforms, intelligent</tspan>
    <tspan x="404" dy="22">automation, and data-driven</tspan>
    <tspan x="404" dy="22">products built for production.</tspan>
  </text>

  <!-- Card 3 -->
  <rect x="750" y="16" width="340" height="188" rx="18" fill="url(#card)" stroke="#7C9CFF44"/>
  <circle cx="796" cy="58" r="18" fill="#102833" stroke="url(#a3)" stroke-width="2"/>
  <path d="M788 64 L796 50 L804 64 Z" fill="none" stroke="#7C9CFF" stroke-width="2" stroke-linejoin="round"/>
  <text x="826" y="64" fill="#E8F4F8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">Enterprise Cloud</text>
  <text x="774" y="108" fill="#9BB4C0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14">
    <tspan x="774" dy="0">Custom software, APIs,</tspan>
    <tspan x="774" dy="22">cloud infrastructure, and</tspan>
    <tspan x="774" dy="22">CI/CD you can trust.</tspan>
  </text>
</svg>
